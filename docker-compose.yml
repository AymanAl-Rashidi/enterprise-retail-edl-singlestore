services:

  postgres:
    image: postgres:16
    container_name: retail_postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  rustfs:
    image: rustfs/rustfs:latest
    container_name: retail_rustfs

    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"

      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - rustfs_data:/data


  singlestore:
    image: ghcr.io/singlestore-labs/singlestoredb-dev:latest
    container_name: retail_singlestore

    environment:
      ROOT_PASSWORD: ${SINGLESTORE_PASSWORD}

    ports:
      - "3306:3306"
      - "8080:8080"

    volumes:
      - singlestore_data:/data
      - ./data/gold_export:/data/gold

    cpus: 8

    restart: unless-stopped


  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    container_name: retail_kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"

      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092"

      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092"

      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"

      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1


  airflow:
    build:
      context: ./airflow

    container_name: retail_airflow

    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"

      S3_ENDPOINT: "http://rustfs:9000"

      POSTGRES_HOST: "postgres"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}

      SINGLESTORE_HOST: "singlestore"
      SINGLESTORE_PORT: "3306"
      SINGLESTORE_USER: ${SINGLESTORE_USER}
      SINGLESTORE_PASSWORD: ${SINGLESTORE_PASSWORD}
      SINGLESTORE_DATABASE: ${SINGLESTORE_DATABASE}

      PYSPARK_PYTHON: "/usr/local/bin/python"

    ports:
      - "8081:8080"

    volumes:
      - airflow_data:/opt/airflow
      - ./airflow/dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/project/scripts
      - ./spark:/opt/airflow/project/spark
      - ./data:/opt/airflow/project/data

    depends_on:
      - postgres
      - rustfs
      - singlestore

    command: standalone
    restart: unless-stopped


volumes:
  postgres_data:
  rustfs_data:
  singlestore_data:
  airflow_data: